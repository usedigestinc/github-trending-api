name: Fetch GitHub Trending

on:
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'script/**'
      - 'test/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - '.github/workflows/run.yml'

permissions:
  contents: write

concurrency:
  group: trending-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned pnpm
        run: npm install -g pnpm@11.19.0
      - name: Install feed dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test feed failure handling
        run: node --test test/*.test.js
      - name: Fetch all 18 Digest feeds
        run: pnpm build
      - name: Publish validated feeds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/daily data/weekly data/monthly
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh Digest trending feeds $(date -u +%FT%TZ)"
          git push origin HEAD:main
